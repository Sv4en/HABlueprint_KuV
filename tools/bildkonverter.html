<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bildkonverter</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --border:#d2d2d7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --card:#2c2c2e; --fg:#f5f5f7; --muted:#a1a1a6; --accent:#0a84ff; --border:#3a3a3c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 16px; text-align: center;
          background: var(--card); cursor: pointer; transition: border-color .15s; }
  #drop.over { border-color: var(--accent); }
  #drop p { margin: 4px 0; color: var(--muted); }
  .controls { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; margin:16px 0; }
  .controls label { display:flex; align-items:center; gap:8px; }
  .controls label.off { opacity:.5; }
  input[type=range] { width: 140px; }
  input[type=number], select { font: inherit; padding:4px 6px; border-radius:6px; border:1px solid var(--border);
                               background:var(--card); color:var(--fg); }
  input[type=number] { width: 90px; }
  .buttons { display:flex; gap:12px; margin-bottom:16px; }
  button { background: var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:.95rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.secondary { background: transparent; color: var(--fg); border:1px solid var(--border); }
  #note { font-size:.85rem; color:var(--muted); margin:0 0 12px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  li { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
       border-radius:10px; padding:8px; }
  li img { width:56px; height:56px; object-fit:cover; border-radius:6px; background:var(--border); flex-shrink:0; }
  li .info { flex:1; min-width:0; }
  li .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li .meta { font-size:.85rem; color:var(--muted); }
  li .err { color:#e5484d; }
  a.dl { color: var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Bildkonverter</h1>
  <div id="drop">
    <strong>Bilder hierher ziehen</strong>
    <p>AVIF, WebP, PNG, JPG, GIF, BMP, HEIC – oder klicken zum Auswählen</p>
    <p>Alles bleibt lokal im Browser</p>
    <input id="file" type="file" multiple hidden
           accept="image/avif,image/webp,image/png,image/jpeg,image/gif,image/bmp,image/heic,image/heif,.avif,.webp,.png,.jpg,.jpeg,.gif,.bmp,.heic,.heif">
  </div>

  <div class="controls">
    <label>Zielformat
      <select id="fmt">
        <option value="image/jpeg">JPG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WebP</option>
      </select>
    </label>
    <label id="qlabel">Qualität <input id="q" type="range" min="10" max="100" value="90"> <span id="qv">90</span>%</label>
    <label>Max. Kante <input id="max" type="number" min="0" step="100" placeholder="Original"> px</label>
  </div>
  <p id="note"></p>

  <div class="buttons">
    <button id="all" disabled>Alle herunterladen</button>
    <button id="clear" class="secondary" disabled>Liste leeren</button>
  </div>

  <ul id="list"></ul>
</main>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), input = $('file'), list = $('list');
const fmtSel = $('fmt'), q = $('q'), qv = $('qv'), qlabel = $('qlabel'), maxIn = $('max'), note = $('note');
const btnAll = $('all'), btnClear = $('clear');
const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
let items = []; // { file, li, url, name }

const size = b => b < 1024*1024 ? (b/1024).toFixed(0) + ' KB' : (b/1024/1024).toFixed(2) + ' MB';
const outName = (n, type) => n.replace(/\.[^.]+$/, '') + '.' + EXT[type];

drop.onclick = () => input.click();
input.onchange = () => { addFiles(input.files); input.value = ''; };
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => addFiles(ev.dataTransfer.files));

q.oninput = () => { qv.textContent = q.value; };
const reconvertAll = () => items.forEach(convert);
q.onchange = reconvertAll;
maxIn.onchange = reconvertAll;
fmtSel.onchange = () => { updateControls(); reconvertAll(); };

btnAll.onclick = async () => {
  for (const it of items) {
    if (!it.url) continue;
    download(it);
    await new Promise(r => setTimeout(r, 250)); // Browser blockiert sonst Mehrfach-Downloads
  }
};
btnClear.onclick = () => {
  items.forEach(it => it.url && URL.revokeObjectURL(it.url));
  items = []; list.innerHTML = ''; updateButtons();
};

function addFiles(files) {
  for (const file of files) {
    const li = document.createElement('li');
    li.innerHTML = '<img alt=""><div class="info"><div class="name"></div><div class="meta"></div></div>';
    list.appendChild(li);
    const it = { file, li, url: null, name: file.name };
    items.push(it);
    convert(it);
  }
  updateButtons();
}

// createImageBitmap kann nicht jedes Format (z. B. HEIC in Safari) – dann über <img> laden
async function loadImage(file) {
  try {
    return await createImageBitmap(file);
  } catch {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      return img;
    } finally {
      URL.revokeObjectURL(url);
    }
  }
}

async function convert(it) {
  const meta = it.li.querySelector('.meta');
  meta.className = 'meta'; meta.textContent = 'Konvertiere …';
  it.li.querySelector('.name').textContent = it.file.name;
  try {
    const img = await loadImage(it.file);
    const w0 = img.width, h0 = img.height;
    const max = parseInt(maxIn.value, 10);
    const scale = max > 0 ? Math.min(1, max / Math.max(w0, h0)) : 1;
    const c = document.createElement('canvas');
    c.width = Math.round(w0 * scale); c.height = Math.round(h0 * scale);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (fmtSel.value === 'image/jpeg') { // JPG kennt keine Transparenz
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
    }
    ctx.drawImage(img, 0, 0, c.width, c.height);
    if (img.close) img.close();
    const blob = await new Promise(r => c.toBlob(r, fmtSel.value, q.value / 100));
    // Safari kann z. B. kein WebP schreiben und liefert dann PNG – Endung danach richten
    const type = EXT[blob.type] ? blob.type : 'image/png';
    note.textContent = type !== fmtSel.value
      ? 'Hinweis: Dieser Browser kann das gewählte Format nicht erzeugen, es wird PNG gespeichert.' : '';
    if (it.url) URL.revokeObjectURL(it.url);
    it.url = URL.createObjectURL(blob);
    it.name = outName(it.file.name, type);
    it.li.querySelector('img').src = it.url;
    it.li.querySelector('.name').textContent = it.name;
    const dims = scale < 1 ? `${w0}×${h0} → ${c.width}×${c.height}` : `${c.width}×${c.height}`;
    meta.innerHTML = '';
    meta.append(`${dims} · ${size(it.file.size)} → ${size(blob.size)} · `);
    const a = document.createElement('a');
    a.className = 'dl'; a.href = it.url; a.download = it.name; a.textContent = 'Download';
    meta.append(a);
  } catch (e) {
    it.url = null;
    meta.className = 'meta err';
    meta.textContent = /\.hei[cf]$/i.test(it.file.name)
      ? 'Fehler: HEIC kann nur Safari lesen'
      : 'Fehler: Datei konnte nicht gelesen werden';
  }
  updateButtons();
}

function download(it) {
  const a = document.createElement('a');
  a.href = it.url; a.download = it.name;
  document.body.appendChild(a); a.click(); a.remove();
}

function updateControls() {
  const png = fmtSel.value === 'image/png';
  q.disabled = png; // PNG ist verlustfrei
  qlabel.classList.toggle('off', png);
}

function updateButtons() {
  btnAll.disabled = !items.some(it => it.url);
  btnClear.disabled = items.length === 0;
}
</script>
</body>
</html>
